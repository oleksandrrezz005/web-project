<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №3 - Варіант 0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Лабораторна робота №3: Основи JavaScript</h1>
        <h2>Варіант 0: Динамічна галерея зображень</h2>

        <div class="gallery-wrapper">
            <!-- Панель керування -->
            <div class="controls-panel">
                <h3>1. Виберіть зображення</h3>
                <select id="image-select">
                    <option value="images/1.jpg" selected>Зображення 1</option>
                    <option value="images/2.jpg">Зображення 2</option>
                    <option value="images/3.jpg">Зображення 3</option>
                    <option value="images/4.jpg">Зображення 4</option>
                </select>

                <h3>2. Параметри зображення</h3>
                
                <div class="input-group">
                    <label for="img-width">Ширина (px):</label>
                    <input type="number" id="img-width" value="300" min="50" max="800">
                </div>

                <div class="input-group">
                    <label for="img-height">Висота (px):</label>
                    <input type="number" id="img-height" value="200" min="50" max="800">
                </div>

                <div class="input-group">
                    <label for="img-border">Товщина рамки (px):</label>
                    <input type="number" id="img-border" value="2" min="0" max="20">
                </div>

                <div class="input-group">
                    <label for="img-alt">Альтернативний текст (alt):</label>
                    <input type="text" id="img-alt" value="Опис першого зображення">
                </div>

                <button id="apply-btn">Застосувати параметри</button>
            </div>

            <!-- Область перегляду -->
            <div class="preview-panel">
                <h3>Попередній перегляд:</h3>
                <div class="image-box">
                    <img id="main-image" src="images/1.jpg" alt="Опис першого зображення">
                </div>
                <p id="info-text">Поточний alt: <i>Опис першого зображення</i></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
