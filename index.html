<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №3 - Варіант 0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Лабораторна робота №3: Основи JavaScript</h1>
        <h2>Варіант 0: Динамічна галерея зображень</h2>

        <div class="gallery-wrapper">
            <!-- Панель керування -->
            <div class="controls-panel">
                <h3>1. Виберіть зображення</h3>
                <select id="image-select">
                    <option value="images/img1.jpg" data-alt="Котик з помаранчевими квітами" selected>1. Котик з квітами (img1)</option>
                    <option value="images/img2.jpg" data-alt="Ромашка з бджолою">2. Ромашка з бджолою (img2)</option>
                    <option value="images/img3.jpg" data-alt="Пейзаж озера на світанку">3. Пейзаж з озером (img3)</option>
                    <option value="images/img4.jpg" data-alt="Синій птах">4. Синій птах (img4)</option>
                </select>

                <h3>2. Параметри зображення</h3>
                
                <div class="input-group">
                    <label for="img-width">Ширина (px):</label>
                    <input type="number" id="img-width" value="350" min="50" max="800">
                </div>

                <div class="input-group">
                    <label for="img-height">Висота (px):</label>
                    <input type="number" id="img-height" value="230" min="50" max="800">
                </div>

                <div class="input-group">
                    <label for="img-border">Товщина рамки (px):</label>
                    <input type="number" id="img-border" value="3" min="0" max="20">
                </div>

                <div class="input-group">
                    <label for="img-alt">Альтернативний текст (alt):</label>
                    <input type="text" id="img-alt" value="Котик з помаранчевими квітами">
                </div>

                <button id="apply-btn">Застосувати параметри</button>
            </div>

            <!-- Область перегляду -->
            <div class="preview-panel">
                <h3>Попередній перегляд:</h3>
                <div class="image-box">
                    <img id="main-image" src="images/img1.jpg" alt="Котик з помаранчевими квітами">
                </div>
                <p id="info-text">Поточний alt: <i>Котик з помаранчевими квітами</i></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
